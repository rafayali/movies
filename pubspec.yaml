name: movies_flutter
description: A movies showcase app build using TMDB api.

publish_to: 'none'

version: 1.1.8+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.4

  provider: ^6.1.5+1
  json_annotation: ^4.9.0
  cached_network_image: ^3.2.2
  quiver: ^3.2.2
  async: ^2.8.1
  intl: ^0.20.2
  logger: ^2.0.0
  shimmer: ^3.0.0
  freezed_annotation: ^3.1.0
  webview_flutter: ^4.2.0
  shared_preferences: ^2.0.11
  flutter_svg: ^2.0.5
  dartx: ^1.0.0
  http: ^1.0.0
  chopper: ^8.0.0
  logging: ^1.1.0
  flutter_rating_bar: ^4.0.1
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.10.4
  json_serializable: ^6.11.3
  freezed: ^3.2.4
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.0
  chopper_generator: ^8.0.0
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  generate: true